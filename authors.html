<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Waandishi | StoriesZone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #080c14;
      --bg-secondary: #0d1220;
      --bg-tertiary: #131928;
      --bg-card: #161d2e;
      --accent-primary: #c084fc;
      --accent-secondary: #9333ea;
      --accent-teal: #2dd4bf;
      --neon-pink: #FF1F8A;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --glass-bg: rgba(13, 18, 32, 0.85);
      --glass-border: rgba(192, 132, 252, 0.15);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.6);
      --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.8);
      --radius-lg: 12px;
      --radius-xl: 20px;
      --transition-fast: 0.2s ease;
      --transition-normal: 0.3s ease;
      --container-padding: 30px;
    }

    body.light-theme {
      --bg-primary: #f0f4ff;
      --bg-secondary: #e8edf8;
      --bg-tertiary: #dde4f5;
      --bg-card: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --glass-bg: rgba(255, 255, 255, 0.88);
      --glass-border: rgba(147, 51, 234, 0.18);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      transition: background 0.4s ease, color 0.4s ease;
      padding-bottom: 70px;
    }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--glass-border);
      padding: 14px var(--container-padding);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-teal));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.2rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }

    .icon-btn:hover {
      color: var(--accent-primary);
      transform: scale(1.1);
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px var(--container-padding);
    }

    /* Page Header */
    .page-header {
      margin-bottom: 28px;
    }
    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 4px solid var(--accent-primary);
      padding-left: 16px;
    }

    /* Search & Filter */
    .search-filter-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 14px 20px 14px 45px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition-fast);
    }
    .search-box input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(192,132,252,0.2);
    }
    .search-box i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .filter-buttons {
      display: flex;
      gap: 10px;
    }
    .filter-btn {
      padding: 10px 18px;
      border-radius: 40px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .filter-btn.active {
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      color: white;
      border-color: transparent;
    }
    .filter-btn:hover:not(.active) {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Authors Grid */
    .authors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .author-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--glass-border);
      overflow: hidden;
      transition: var(--transition-normal);
      cursor: pointer;
    }
    .author-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(192,132,252,0.3);
    }

    .author-cover {
      height: 100px;
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-teal));
      position: relative;
    }
    .author-avatar {
      position: absolute;
      bottom: -35px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--bg-card);
      object-fit: cover;
      background: var(--bg-tertiary);
    }
    .author-avatar-placeholder {
      position: absolute;
      bottom: -35px;
      left: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--bg-card);
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-teal));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      color: white;
      font-family: 'Playfair Display', serif;
    }
    .author-info {
      padding: 48px 18px 18px;
    }
    .author-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .verified-icon {
      color: var(--accent-teal);
      font-size: 0.9rem;
    }
    .author-bio {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .author-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .author-stats span {
      color: var(--accent-primary);
      font-weight: 700;
    }
    .follow-btn {
      width: 100%;
      padding: 10px;
      border-radius: 40px;
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
      border: none;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition-normal);
    }
    .follow-btn.following {
      background: transparent;
      border: 1px solid var(--accent-primary);
      color: var(--accent-primary);
    }
    .follow-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    /* Stories Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-normal);
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--bg-secondary);
      border-radius: var(--radius-xl);
      max-width: 800px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
      position: relative;
    }
    .modal-header {
      padding: 20px 24px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .modal-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }
    .modal-avatar-placeholder {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-secondary), var(--accent-teal));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: white;
    }
    .modal-author-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .modal-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 24px;
    }
    .stories-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .story-row {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .story-row:hover {
      transform: translateX(5px);
      border-left: 3px solid var(--accent-primary);
    }
    .story-title {
      font-weight: 700;
      font-size: 0.9rem;
    }
    .story-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .story-price {
      font-size: 0.7rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--neon-pink), var(--accent-teal));
      color: #000;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .empty-stories {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
    .loading-spinner {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--bg-tertiary);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert-container {
      position: fixed;
      bottom: 80px;
      right: 16px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .alert {
      background: var(--bg-card);
      border-left: 4px solid var(--accent-primary);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      color: var(--text-primary);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      padding: 10px 12px;
      border-top: 1px solid var(--glass-border);
      z-index: 99;
    }
    .bottom-nav a, .bottom-nav button {
      background: none;
      border: none;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.7rem;
      gap: 4px;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: inherit;
    }
    .bottom-nav a i, .bottom-nav button i {
      font-size: 1.2rem;
    }
    .bottom-nav a:hover, .bottom-nav button:hover {
      color: var(--accent-primary);
    }

    /* Loading Overlay */
    .page-loader {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    @media (max-width: 640px) {
      :root { --container-padding: 16px; }
      .authors-grid { grid-template-columns: 1fr; }
      .filter-buttons { width: 100%; overflow-x: auto; }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html" class="logo">StoriesZone</a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
      <a href="index.html" class="icon-btn"><i class="fas fa-home"></i></a>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title"><i class="fas fa-users"></i> Waandishi Wetu</h1>
    </div>

    <div class="search-filter-bar">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchAuthors" placeholder="Tafuta muandishi kwa jina...">
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">Wote</button>
        <button class="filter-btn" data-filter="verified">Walioidhinishwa</button>
        <button class="filter-btn" data-filter="top">Waliopo Juu</button>
      </div>
    </div>

    <div id="authorsGrid" class="authors-grid">
      <!-- Loading skeleton -->
      <div class="loading-spinner" style="grid-column: 1/-1;"><div class="spinner"></div><p style="margin-top:12px;">Inapakia waandishi...</p></div>
    </div>
  </div>

  <div class="alert-container" id="alertContainer"></div>

  <div class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Nyumbani</span></a>
    <a href="authors.html" class="active-nav"><i class="fas fa-users"></i><span>Waandishi</span></a>
    <a href="profile.html"><i class="fas fa-user"></i><span>Profaili</span></a>
  </div>

  <!-- Modal for author stories -->
  <div class="modal-overlay" id="authorModal">
    <div class="modal-content">
      <div class="modal-header">
        <div id="modalAvatar"></div>
        <div>
          <div class="modal-author-name" id="modalAuthorName">Muandishi</div>
          <div style="font-size:0.75rem; color:var(--text-muted);" id="modalAuthorBio"></div>
        </div>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <h3 style="margin-bottom:16px;"><i class="fas fa-book-open"></i> Hadithi Zake</h3>
        <div id="modalStoriesList" class="stories-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Supabase Client (renamed to avoid conflict)
    const STORIESZONE_SUPABASE_URL = 'https://ifpntbnrwgsooqqkoefk.supabase.co';
    const STORIESZONE_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcG50Ym5yd2dzb29xcWtvZWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5MzE4MzMsImV4cCI6MjA5NDUwNzgzM30.m0ggLnB8ywRNNRSJv3YsJaKZ5g8a0VDIN6mQzM-BAwM';
    const szSupabase = window.supabase.createClient(STORIESZONE_SUPABASE_URL, STORIESZONE_SUPABASE_ANON_KEY);

    // Global state
    let allAuthors = [];
    let currentUserId = null;
    let followingAuthors = new Set(); // author_profile IDs that current user follows
    let currentFilter = 'all';
    let searchQuery = '';

    // DOM Elements
    const authorsGrid = document.getElementById('authorsGrid');
    const alertContainer = document.getElementById('alertContainer');
    const searchInput = document.getElementById('searchAuthors');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const authorModal = document.getElementById('authorModal');
    const modalAuthorName = document.getElementById('modalAuthorName');
    const modalAuthorBio = document.getElementById('modalAuthorBio');
    const modalAvatar = document.getElementById('modalAvatar');
    const modalStoriesList = document.getElementById('modalStoriesList');

    // Helper: show alert
    function showAlert(message, type = 'info') {
      const alertDiv = document.createElement('div');
      alertDiv.className = 'alert';
      alertDiv.style.borderLeftColor = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : 'var(--accent-primary)';
      alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
      alertContainer.appendChild(alertDiv);
      setTimeout(() => alertDiv.remove(), 3500);
    }

    // Fetch all authors from author_profiles table
    async function fetchAuthors() {
      try {
        const { data, error } = await szSupabase
          .from('author_profiles')
          .select('*')
          .order('followers_count', { ascending: false });
        
        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error('fetchAuthors error:', err);
        showAlert('Imeshindwa kupakia waandishi', 'error');
        return [];
      }
    }

    // Fetch current user's following list
    async function fetchUserFollowing() {
      if (!currentUserId) return;
      try {
        const { data, error } = await szSupabase
          .from('author_followers')
          .select('author_id')
          .eq('follower_id', currentUserId);
        
        if (error) throw error;
        followingAuthors.clear();
        if (data) {
          data.forEach(f => followingAuthors.add(f.author_id));
        }
      } catch (err) {
        console.error('fetchUserFollowing error:', err);
      }
    }

    // Follow author using RPC function
    async function followAuthor(authorProfileId) {
      if (!currentUserId) {
        showAlert('Ingia kwanza ili kufuata muandishi', 'error');
        return false;
      }
      try {
        const { data, error } = await szSupabase.rpc('follow_author', {
          target_author_id: authorProfileId,
          follower_user_id: currentUserId
        });
        if (error) throw error;
        if (data && data.success) {
          followingAuthors.add(authorProfileId);
          // Update local author list followers_count
          const author = allAuthors.find(a => a.id === authorProfileId);
          if (author) author.followers_count = (author.followers_count || 0) + 1;
          showAlert('Umefuata muandishi!', 'success');
          renderAuthors();
          return true;
        }
        return false;
      } catch (err) {
        console.error('followAuthor error:', err);
        showAlert('Hitilafu wakati wa kufuata', 'error');
        return false;
      }
    }

    // Unfollow author using RPC function
    async function unfollowAuthor(authorProfileId) {
      if (!currentUserId) return false;
      try {
        const { data, error } = await szSupabase.rpc('unfollow_author', {
          target_author_id: authorProfileId,
          follower_user_id: currentUserId
        });
        if (error) throw error;
        if (data && data.success) {
          followingAuthors.delete(authorProfileId);
          const author = allAuthors.find(a => a.id === authorProfileId);
          if (author) author.followers_count = Math.max(0, (author.followers_count || 0) - 1);
          showAlert('Umemwachia muandishi', 'info');
          renderAuthors();
          return true;
        }
        return false;
      } catch (err) {
        console.error('unfollowAuthor error:', err);
        showAlert('Hitilafu wakati wa kuachia', 'error');
        return false;
      }
    }

    // Toggle follow
    async function toggleFollow(authorProfileId, btnElement) {
      if (!currentUserId) {
        showAlert('Ingia kwanza ili kufuata muandishi', 'error');
        return;
      }
      if (followingAuthors.has(authorProfileId)) {
        await unfollowAuthor(authorProfileId);
      } else {
        await followAuthor(authorProfileId);
      }
    }

    // Fetch stories for a specific author using the RPC function
    async function fetchAuthorStories(authorProfileId) {
      try {
        const { data, error } = await szSupabase.rpc('get_author_stories', {
          author_profile_id: authorProfileId
        });
        if (error) throw error;
        return data || [];
      } catch (err) {
        console.error('fetchAuthorStories error:', err);
        return [];
      }
    }

    // Open modal with author stories
    async function openAuthorModal(author) {
      modalAuthorName.textContent = author.name;
      modalAuthorBio.textContent = author.bio || 'Hakuna maelezo ya ziada.';
      
      // Avatar
      if (author.avatar_url) {
        modalAvatar.innerHTML = `<img src="${author.avatar_url}" alt="${author.name}" class="modal-avatar">`;
      } else {
        modalAvatar.innerHTML = `<div class="modal-avatar-placeholder">${author.name.charAt(0).toUpperCase()}</div>`;
      }
      
      // Show loading in stories list
      modalStoriesList.innerHTML = '<div class="loading-spinner"><div class="spinner"></div><p>Inapakia hadithi...</p></div>';
      authorModal.classList.add('active');
      
      // Fetch stories
      const stories = await fetchAuthorStories(author.id);
      
      if (stories.length === 0) {
        modalStoriesList.innerHTML = '<div class="empty-stories"><i class="fas fa-book"></i> Muandishi hana hadithi bado.</div>';
      } else {
        modalStoriesList.innerHTML = stories.map(story => `
          <div class="story-row" onclick="window.location.href='story.html?id=${story.id}'">
            <div class="story-title">${escapeHtml(story.title)}</div>
            <div class="story-meta">
              <span class="story-price">${story.price === 0 ? 'BURE' : `TZS ${story.price}`}</span>
              <i class="fas fa-chevron-right" style="color:var(--text-muted);"></i>
            </div>
          </div>
        `).join('');
      }
    }

    // Close modal
    function closeModal() {
      authorModal.classList.remove('active');
    }

    // Render authors grid with current filter and search
    function renderAuthors() {
      let filtered = [...allAuthors];
      
      // Apply search filter
      if (searchQuery) {
        filtered = filtered.filter(a => 
          a.name.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }
      
      // Apply category filter
      if (currentFilter === 'verified') {
        filtered = filtered.filter(a => a.is_verified === true);
      } else if (currentFilter === 'top') {
        filtered = filtered.sort((a,b) => (b.followers_count || 0) - (a.followers_count || 0)).slice(0, 12);
      }
      
      if (filtered.length === 0) {
        authorsGrid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px; color:var(--text-muted);">
          <i class="fas fa-user-slash" style="font-size:3rem; margin-bottom:12px; display:block;"></i>
          Hakuna waandishi waliopatikana.
        </div>`;
        return;
      }
      
      authorsGrid.innerHTML = filtered.map(author => {
        const isFollowing = followingAuthors.has(author.id);
        const avatarHtml = author.avatar_url
          ? `<img src="${author.avatar_url}" alt="${author.name}" class="author-avatar">`
          : `<div class="author-avatar-placeholder">${author.name.charAt(0).toUpperCase()}</div>`;
        
        return `
          <div class="author-card" data-author-id="${author.id}">
            <div class="author-cover"></div>
            ${avatarHtml}
            <div class="author-info">
              <div class="author-name">
                ${escapeHtml(author.name)}
                ${author.is_verified ? '<i class="fas fa-check-circle verified-icon"></i>' : ''}
              </div>
              <div class="author-bio">${escapeHtml(author.bio || 'Muandishi wa StoriesZone.')}</div>
              <div class="author-stats">
                <div><i class="fas fa-book-open"></i> Hadithi: <span>${author.stories_count || 0}</span></div>
                <div><i class="fas fa-users"></i> Wafuasi: <span>${author.followers_count || 0}</span></div>
              </div>
              <button class="follow-btn ${isFollowing ? 'following' : ''}" data-author-id="${author.id}">
                ${isFollowing ? '<i class="fas fa-check"></i> Unafuata' : '<i class="fas fa-user-plus"></i> Fuata'}
              </button>
            </div>
          </div>
        `;
      }).join('');
      
      // Attach event listeners to follow buttons and cards
      document.querySelectorAll('.follow-btn').forEach(btn => {
        const authorId = btn.dataset.authorId;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFollow(authorId, btn);
        });
      });
      
      document.querySelectorAll('.author-card').forEach(card => {
        const authorId = card.dataset.authorId;
        const author = allAuthors.find(a => a.id === authorId);
        if (author) {
          card.addEventListener('click', () => openAuthorModal(author));
        }
      });
    }

    // Load all data
    async function loadAllData() {
      authorsGrid.innerHTML = '<div class="loading-spinner" style="grid-column: 1/-1;"><div class="spinner"></div><p style="margin-top:12px;">Inapakia waandishi...</p></div>';
      
      // Get current user
      const { data: { user } } = await szSupabase.auth.getUser();
      currentUserId = user ? user.id : null;
      
      // Fetch authors
      allAuthors = await fetchAuthors();
      
      // Fetch user's following if logged in
      if (currentUserId) {
        await fetchUserFollowing();
      }
      
      renderAuthors();
    }

    // Helper: escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // Theme Toggle
    function initTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeToggleBtn');
      if (localStorage.getItem('theme') === 'light') {
        body.classList.add('light-theme');
        themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
      } else {
        themeBtn.innerHTML = '<i class="fas fa-moon"></i>';
      }
      themeBtn.addEventListener('click', () => {
        body.classList.toggle('light-theme');
        const isLight = body.classList.contains('light-theme');
        themeBtn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      });
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderAuthors();
    });
    
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAuthors();
      });
    });
    
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    authorModal.addEventListener('click', (e) => {
      if (e.target === authorModal) closeModal();
    });

    // Initialize
    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      await loadAllData();
    });
  </script>
</body>
</html>
