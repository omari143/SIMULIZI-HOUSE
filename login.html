    body {
      background-color: var(--dark);

      display: flex;
      justify-content: center;

      padding: 20px;

    .devtools-blocker {

      background: black;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 20px;

    .devtools-blocker.show { display: flex; }

    .devtools-blocker p { color: white; font-size: 16px; }
    .devtools-blocker button {
      background: #c62828; color: white; border: none;
      padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer;
    }

      background-color: var(--darker);

    .auth-form h2 {
      color: var(--light); margin-bottom: 20px;
      text-align: center; font-size: 1.5rem;
    }
    
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label {
      display: block; margin-bottom: 8px;
      color: var(--light-gray); font-weight: 500;
    }
    .form-group input {
      width: 100%; padding: 12px 15px;
      border-radius: 8px; border: 1px solid var(--gray);
      background-color: var(--dark); color: var(--light); font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: var(--primary); }

    .password-toggle {
      position: absolute; right: 15px; top: 50px;
      color: var(--light-gray); cursor: pointer; font-size: 1.2rem;
    }

    .checkbox-group {
      display: flex; align-items: flex-start;
      gap: 8px; margin: 15px 0;
      font-size: 0.85rem; color: var(--light-gray);
    }
    .checkbox-group input[type="checkbox"] {
      margin-top: 3px; accent-color: var(--primary);
    }
    .checkbox-group a { color: var(--secondary); text-decoration: underline; }

    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background-color: var(--primary); color: #000;
      font-weight: bold; font-size: 1rem; cursor: pointer;
      transition: all 0.3s ease; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { background-color: var(--secondary); }
    .btn:disabled { background-color: #555; cursor: not-allowed; }
    
    .divider {
      display: flex; align-items: center;
      margin: 20px 0; color: var(--light-gray);
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; border-bottom: 1px solid var(--gray);
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }
    
    .social-login { display: flex; flex-direction: column; gap: 10px; }
    
    .social-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 12px; border-radius: 8px; border: 1px solid var(--gray);
      background-color: var(--dark); color: var(--light);
      font-size: 1rem; cursor: pointer; transition: all 0.3s ease;
    }
    .social-btn i { margin-right: 10px; font-size: 1.2rem; }
    .social-btn.google {
      background-color: #4285F4; color: white; border-color: #4285F4;
    }
    .social-btn.google:hover { background-color: #3367D6; }
    
    .auth-footer {
      text-align: center; margin-top: 25px;
      color: var(--light-gray); font-size: 0.85rem;
    }
    .auth-footer a { color: var(--secondary); text-decoration: none; }
    .auth-footer p { margin-bottom: 8px; }

    .legal-links { margin-top: 15px; font-size: 0.8rem; text-align: center; }
    .legal-links a { color: var(--light-gray); margin: 0 8px; }

    @media (max-width: 576px) {
      .auth-container { padding: 30px 20px; }
      .logo h1 { font-size: 1.5rem; }
    }

<script>
    // ========== ULINZI WA DEVELOPER TOOLS ==========
    (function antiDevTools() {
        let devToolsOpen = false;
        function blockDevTools() {
            if (!devToolsOpen) {
                devToolsOpen = true;
                const blocker = document.getElementById('devtoolsBlocker');
                if (blocker) { blocker.classList.add('show'); document.body.style.overflow = 'hidden'; }
            }
        }
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) ||
                (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) ||
                (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
                (e.ctrlKey && (e.key === 'S' || e.key === 's')) ||
                (e.ctrlKey && (e.key === 'P' || e.key === 'p')) ||
                e.key === 'PrintScreen') {
                e.preventDefault(); blockDevTools(); return false;
            }
        });
        window.addEventListener('contextmenu', function(e) { e.preventDefault(); blockDevTools(); return false; });
        setInterval(function() {
            const start = performance.now(); debugger; const end = performance.now();
            if (end - start > 100) blockDevTools();
        }, 1000);
        let lastWidth = window.outerWidth, lastHeight = window.outerHeight;
        setInterval(function() {
            const nw = window.outerWidth, nh = window.outerHeight;
            if (Math.abs(nw - lastWidth) > 100 || Math.abs(nh - lastHeight) > 100) {
                if (nw < lastWidth || nh < lastHeight) blockDevTools();
            }
            lastWidth = nw; lastHeight = nh;
        }, 500);
        console.log = function() {}; console.error = function() {};
        console.warn = function() {}; console.info = function() {};
    })();

    // ========== KUGUNDUA KIFAA ==========
    function detectDeviceFraud() {
        const userAgent = navigator.userAgent;
        if (navigator.webdriver === true) return 'AUTOMATION_TOOL_DETECTED';
        const fakePatterns = ['HeadlessChrome','Headless','PhantomJS','Selenium','Puppeteer','Playwright','Cypress','Chrome-Lighthouse'];
        for (let p of fakePatterns) { if (userAgent.includes(p)) return 'FAKE_USER_AGENT_DETECTED'; }
        return 'CLEAN';
    }

    function isGenuineMobileDevice() {
        const userAgent = navigator.userAgent;
        const isMobileUA = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone|Opera Mini|IEMobile|Mobile|mobi/i.test(userAgent);
        const isMobileScreen = window.innerWidth <= 768;
        const hasTouchScreen = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const isPCOS = /Mac|Win|Linux|X11/i.test(userAgent);
        const hasOrientation = typeof window.orientation !== 'undefined';
        const fraud = detectDeviceFraud();
        if (fraud !== 'CLEAN') return { allowed: false, reason: fraud };
        if (isPCOS && window.innerWidth >= 1024 && !hasTouchScreen && !isMobileUA)
            return { allowed: false, reason: 'PC_NOT_ALLOWED' };
        let m = 0;
        if (isMobileUA) m++; if (isMobileScreen) m++;
        if (hasTouchScreen) m++; if (hasOrientation) m++;
        if (m >= 2) return { allowed: true, deviceType: 'MOBILE' };
        return { allowed: false, reason: 'DEVICE_NOT_RECOGNIZED_AS_MOBILE' };
    }

    const deviceCheck = isGenuineMobileDevice();
    if (!deviceCheck.allowed) {
        let msg = deviceCheck.reason === 'PC_NOT_ALLOWED'
            ? 'Tovuti hii inapatikana kwenye simu za mkononi pekee.'
            : deviceCheck.reason === 'AUTOMATION_TOOL_DETECTED'
            ? 'Zana za kiotomatiki haziruhusiwi.'
            : 'Tafadhali tumia simu yako ya mkononi.';
        document.body.innerHTML = `<div style="text-align:center;padding:50px;background:#121212;min-height:100vh;display:flex;align-items:center;justify-content:center;"><div style="background:#0A0A0A;padding:40px;border-radius:20px;border:2px solid #c62828;max-width:500px;"><h1 style="color:#c62828;margin-bottom:20px;">KIFAA KIMEZUIWA</h1><p style="color:#F5F5F5;line-height:1.6;">${msg}</p></div></div>`;
        throw new Error(deviceCheck.reason);
    }

    // ========== FINGERPRINT ==========
    async function generateFingerprint() {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 200; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 200, 50);
            ctx.font = '14px Arial'; ctx.fillStyle = '#fff';
            ctx.fillText(navigator.userAgent.substring(0, 30), 10, 30);
            const gl = canvas.getContext('webgl');
            let webglInfo = '';
            if (gl) {
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) webglInfo = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '';
            }
            const data = [
                navigator.userAgent, navigator.language,
                screen.width + 'x' + screen.height, screen.colorDepth,
                new Date().getTimezoneOffset(),
                !!window.sessionStorage, !!window.localStorage,
                webglInfo, canvas.toDataURL()
            ].join('|');
            let hash = 0;
            for (let i = 0; i < data.length; i++) {
                const c = data.charCodeAt(i);
                hash = ((hash << 5) - hash) + c;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16);
        } catch(e) { return null; }
    }

    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/tablet|ipad/i.test(ua)) return 'tablet';
        if (/mobile|android|iphone/i.test(ua)) return 'mobile';
        return 'unknown';
    }

    // ========== UPDATE USER TABLE BAADA YA LOGIN ==========
    async function updateUserOnLogin(userId, email) {
        try {
            const fingerprint = await generateFingerprint();
            const now = new Date().toISOString();
            const userAgent = navigator.userAgent;
            const deviceType = getDeviceType();

            const { error } = await mySupabase
                .from('users')
                .update({
                    last_sign_in_at: now,
                    signin_date: now,
                    last_seen: now,
                    updated_at: now,
                    is_active: true,
                    status: 'active',
                    device_fingerprint: fingerprint,
                    last_user_agent: userAgent,
                    device_type: deviceType,
                    failed_login_attempts: 0
                })
                .eq('email', email);

            if (error) {
                // Ikiwa hakuna rekodi kwenye users table, iunda
                if (error.code === 'PGRST116' || error.message.includes('No rows')) {
                    await mySupabase.from('users').insert({
                        id: userId,
                        created_at: now,
                        email: email,
                        is_active: true,
                        sign_in_method: 'email',
                        provider: 'email',
                        verified: false,
                        status: 'active',
                        signup_date: now,
                        signin_date: now,
                        last_sign_in_at: now,
                        last_seen: now,
                        updated_at: now,
                        device_fingerprint: fingerprint,
                        last_user_agent: userAgent,
                        device_type: deviceType,
                        failed_login_attempts: 0,
                        is_blocked: false,
                        suspicious_activity: false,
                        total_stories_viewed: 0,
                        total_time_spent: 0,
                        role: 'user'
                    });
                }
            }
        } catch(e) {
            // Hitilafu ya update haikatazi login
        }
    }

    // ========== ANGALIA KAMA MTUMIAJI AMEZUIWA ==========
    async function checkIfUserBlocked(email) {
        try {
            const { data, error } = await mySupabase
                .from('users')
                .select('is_blocked, block_reason, blocked_until, status')
                .eq('email', email)
                .maybeSingle();

            if (error || !data) return { blocked: false };

            if (data.is_blocked) {
                // Angalia kama muda wa kuzuiwa umepita
                if (data.blocked_until) {
                    const now = new Date();
                    const blockedUntil = new Date(data.blocked_until);
                    if (now > blockedUntil) {
                        // Muda umepita - fungua akaunti
                        await mySupabase.from('users').update({
                            is_blocked: false,
                            block_reason: null,
                            blocked_until: null,
                            failed_login_attempts: 0
                        }).eq('email', email);
                        return { blocked: false };
                    }
                }
                return {
                    blocked: true,
                    reason: data.block_reason || 'Akaunti yako imezuiwa.',
                    until: data.blocked_until
                };
            }
            return { blocked: false };
        } catch(e) { return { blocked: false }; }
    }

    // ========== ONG'EZA MAJARIBIO YALIYOSHINDWA ==========
    async function incrementFailedAttempts(email) {
        try {
            const { data } = await mySupabase
                .from('users')
                .select('failed_login_attempts')
                .eq('email', email)
                .maybeSingle();

            if (data) {
                const attempts = (data.failed_login_attempts || 0) + 1;
                const updateData = { failed_login_attempts: attempts };

                // Baada ya majaribio 5, zuia akaunti kwa saa 1
                if (attempts >= 5) {
                    const blockedUntil = new Date();
                    blockedUntil.setHours(blockedUntil.getHours() + 1);
                    updateData.is_blocked = true;
                    updateData.block_reason = 'Majaribio mengi ya kuingia yameshindwa. Jaribu tena baada ya saa 1.';
                    updateData.blocked_until = blockedUntil.toISOString();
                    updateData.suspicious_activity = true;
                    updateData.suspicious_reason = `Majaribio ${attempts} ya kuingia yameshindwa`;
                }

                await mySupabase.from('users').update(updateData).eq('email', email);
            }
        } catch(e) {}
    }

    // ========== GOOGLE LOGIN ==========
    async function loginWithGoogle() {
        if (!document.getElementById('terms').checked) {
            Swal.fire({
                title: 'Inahitajika',
                text: 'Lazima ukubali Masharti ya Huduma na Sera ya Faragha kabla ya kuingia.',
                icon: 'warning', confirmButtonColor: '#FF6B00',
                background: '#121212', color: '#F5F5F5'
            });
            return;
        }
        try {
            const { error } = await mySupabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/index.html' }
            });
            if (error) throw error;
            Swal.fire({
                title: 'Inaelekeza...', text: 'Unasubiriwa kwenye Google...',
                icon: 'info', showConfirmButton: false,
                background: '#121212', color: '#F5F5F5', iconColor: '#FFD700'
            });
        } catch (error) {
            Swal.fire({
                title: 'Hitilafu!', text: error.message, icon: 'error',
                confirmButtonColor: '#FF6B00', background: '#121212', color: '#F5F5F5'
            });
        }
    }

    // ========== FORM SUBMISSION ==========
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!document.getElementById('terms').checked) {
            Swal.fire({
                title: 'Inahitajika', text: 'Lazima ukubali masharti kabla ya kuingia.',
                icon: 'warning', confirmButtonColor: '#FF6B00',
                background: '#121212', color: '#F5F5F5'
            });
            return;
        }

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            Swal.fire({
                title: 'Hitilafu!', text: 'Jaza sehemu zote',
                icon: 'error', confirmButtonColor: '#FF6B00',
                background: '#121212', color: '#F5F5F5'
            });
            return;
        }

        Swal.fire({
            title: 'Inakagua...', allowOutsideClick: false,
            didOpen: () => Swal.showLoading(),
            background: '#121212', color: '#F5F5F5'
        });

        try {
            // Kwanza angalia kama akaunti imezuiwa
            const blockCheck = await checkIfUserBlocked(email);
            if (blockCheck.blocked) {
                let blockMsg = blockCheck.reason;
                if (blockCheck.until) {
                    const until = new Date(blockCheck.until);
                    blockMsg += ` Hadi: ${until.toLocaleString('sw-TZ')}`;
                }
                Swal.fire({
                    title: 'Akaunti Imezuiwa!', text: blockMsg,
                    icon: 'error', confirmButtonColor: '#FF6B00',
                    background: '#121212', color: '#F5F5F5'
                });
                return;
            }

            // Jaribu kuingia
            const { data, error } = await mySupabase.auth.signInWithPassword({ email, password });

            if (error) {
                // Ongeza majaribio yaliyoshindwa
                await incrementFailedAttempts(email);

                let errorMsg = 'Hitilafu imetokea. Jaribu tena.';
                if (error.message.includes('Invalid login credentials')) {
                    errorMsg = 'Barua pepe au nenosiri sio sahihi. Hakikisha taarifa zako ni sahihi.';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMsg = 'Barua pepe yako haijathibitishwa. Angalia sanduku lako la barua pepe (au spam) na bofya kiungo cha uthibitisho.';
                } else if (error.message.includes('Too many requests')) {
                    errorMsg = 'Majaribio mengi mno. Tafadhali subiri dakika chache kisha jaribu tena.';
                }

                Swal.fire({
                    title: 'Imeshindwa Kuingia!', text: errorMsg,
                    icon: 'error', confirmButtonColor: '#FF6B00',
                    background: '#121212', color: '#F5F5F5'
                });
                return;
            }

            // Login imefanikiwa - sasisha taarifa za mtumiaji
            if (data.user) {
                await updateUserOnLogin(data.user.id, data.user.email);
            }

            Swal.fire({
                title: 'Karibu! 🎉',
                text: 'Umeingia kikamilifu!',
                icon: 'success',
                confirmButtonText: 'Endelea',
                confirmButtonColor: '#FF6B00',
                background: '#121212', color: '#F5F5F5', iconColor: '#FFD700'
            }).then(() => {
                window.location.href = 'index.html';
            });

        } catch (error) {
            Swal.fire({
                title: 'Hitilafu!', text: error.message, icon: 'error',
                confirmButtonColor: '#FF6B00', background: '#121212', color: '#F5F5F5'
            });
        }
    });

    // ========== LEGAL MODALS ==========
    function openTerms() {
        Swal.fire({
            title: 'Masharti ya Huduma',
